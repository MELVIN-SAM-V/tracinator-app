[package]
name = "tracinator-desktop"
version = "0.1.0"
description = "Tracinator desktop shell"
authors = ["Tracinator contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "=2.4.4"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-updater = "=2.12.0"
tauri-plugin-process = "=2.3.1"
tokio = { version = "1", features = ["net", "time", "io-util", "rt", "fs"] }
zip = "2"
# Per-launch API token (lib.rs, new_api_token). Already in the build via
# Tauri's own dependencies, so no new crate version.
getrandom = "0.3"

# Same windows-sys line tauri-plugin-updater already pulls in, so this adds
# no new crate version to the build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
