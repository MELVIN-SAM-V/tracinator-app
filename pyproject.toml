[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracinator"
version = "0.1.0"
description = "Interactive control-flow graphs and real execution traces for Python functions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",  # required by FastAPI's TestClient
    "mangum>=0.17",  # the demo app (exercised by the tests) imports it
]
lambda = [
    "mangum>=0.17",
]

[project.scripts]
tracinator = "tracinator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tracinator*"]

[tool.setuptools.package-data]
# tracinator/ui/dist/ (the built frontend app.py serves via its SPA catch-all
# route) isn't a Python package — `packages.find` above never picks it up on
# its own, so it has to be listed explicitly or the wheel silently ships
# without a frontend to serve at all.
tracinator = ["ui/dist/**/*"]
